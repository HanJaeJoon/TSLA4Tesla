name: Android Build

on:
  workflow_dispatch:
  # workflow_dispatch 워크플로는 기본 브랜치에 파일이 있어야 Actions UI 목록에 뜬다.
  # main 병합 전까지는 작업 브랜치 push로 실행한다. 병합 시 이 push 블록은 제거한다.
  push:
    branches:
      - dev/jjhan-adapp-kit
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Build AAB
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Show signing certificate
        run: keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
